{% extends 'base.html' %}
{% block title %}Page not found — {{ site.name }}{% endblock %}

{% block content %}
<section class="error-page">
  <div class="error-inner reveal">
    <p class="error-code">404</p>
    <h1 class="page-title">This page doesn't exist.</h1>
    <p class="page-lead">The link may be outdated, or the page was moved.</p>
    <a class="btn-primary" href="{{ url_for('main.index') }}">Back to home</a>
  </div>
</section>
{% endblock %}
